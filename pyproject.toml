[tool.poetry]
name = "kumacompanion"
version = "0.1.0"
description = "CLI for managing Uptime Kuma"
authors = ["Zerka <contact@zerka.dev>"]
readme = "README.md"
packages = [{include = "kuma"}]

[tool.poetry.scripts]
kuma = 'kuma.main:main'

[tool.poetry.dependencies]
python = "^3.10"
uptime-kuma-api = "1.2.1"
python-dotenv = "^1.0.1"
argparse = "^1.4.0"
tabulate = "^0.9.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
